name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'zhangxiaowei6/legado-mq'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate semantic version and monotonic versionCode
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          version_code="$(sed -n 's/^VERSION_CODE=//p' gradle.properties)"
          test "${GITHUB_REF_NAME}" = "v${version_name}"
          [[ "${version_name}" =~ ^(0|[1-9][0-9]*)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          expected=$((1000000 + major * 10000 + minor * 100 + patch))
          test "${version_code}" -eq "${expected}"
          max_previous=0
          while IFS= read -r tag; do
            [[ "${tag}" = "${GITHUB_REF_NAME}" ]] && continue
            if [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
              candidate=$((1000000 + BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]))
              (( candidate > max_previous )) && max_previous="${candidate}"
            fi
          done < <(git tag --list 'v*')
          test "${version_code}" -gt "${max_previous}"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64}"
          printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/moqi-release.jks"
          chmod 600 "${RUNNER_TEMP}/moqi-release.jks"

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/moqi-release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleAppRelease --stacktrace

      - name: Verify APK signature and checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/app/release/moqi-reader-${GITHUB_REF_NAME}.apk"
          test -f "${apk}"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "${apksigner}"
          verify_output="$(${apksigner} verify --verbose --print-certs "${apk}")"
          printf '%s\n' "${verify_output}"
          actual="$(printf '%s\n' "${verify_output}" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          expected="FE5E48992D1B0E4F8EB556A180C7801F55B31BD5EC735E1A58BC48495F295FB9"
          test "${actual}" = "${expected}"
          sha256sum "${apk}" | sed "s#  .*#  $(basename "${apk}")#" > SHA256SUMS.txt
          mapping="app/build/outputs/mapping/appRelease/mapping.txt"
          if [[ -f "${mapping}" ]]; then
            cp "${mapping}" "mapping-${GITHUB_REF_NAME}.txt"
          fi
          echo "apk=${apk}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moqi-reader-${{ github.ref_name }}
          path: |
            ${{ steps.verify.outputs.apk }}
            SHA256SUMS.txt
            mapping-${{ github.ref_name }}.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          awk '/^# 墨栖阅读 v/{seen++; if (seen == 2) exit} seen == 1' app/src/main/assets/updateLog.md > "${notes}"
          files=("${{ steps.verify.outputs.apk }}" "SHA256SUMS.txt")
          [[ -f "mapping-${GITHUB_REF_NAME}.txt" ]] && files+=("mapping-${GITHUB_REF_NAME}.txt")
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --verify-tag \
            --title "Moqi Reader ${GITHUB_REF_NAME}" \
            --notes-file "${notes}"
