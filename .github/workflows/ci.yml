name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests
        run: ./gradlew testAppDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew lintAppDebug --stacktrace
      - name: Debug APK
        run: ./gradlew assembleAppDebug --stacktrace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: modules/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm build
