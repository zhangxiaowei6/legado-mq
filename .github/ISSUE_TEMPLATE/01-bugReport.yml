name: BUG提交 / BUG Report
description: Report bugs to developers
labels: ["BUG"]
body:
  - type: checkboxes
    attributes:
      label: 确认 / Assignments
      description: 提交issue请确保完成以下前提，否则该issue可能被忽略 / Make sure you read checkboxs below
      options:
        - label: 搜索现有issues，不存在相似或相关的issue / No similar or related issues
          required: true
        - label: 最新[墨栖阅读正式版](https://github.com/zhangxiaowei6/legado-mq/releases/latest)依然存在此问题 / The issue occurs in the latest Moqi Reader release
          required: true
        - label: 此问题和Xposed、Lsposed、Magisk、手机主题、浏览器插件、无障碍服务等无关 / Make sure your machine is not touched by hook frameworks, plugins, accessibility etc
          required: true

  - type: textarea
    attributes:
      label: 问题描述 / Describe Bugs
      description: |
        请说明问题是否为墨栖阅读独有。仅在本仓库反馈墨栖阅读问题；上游项目问题请先说明上游复现结果和对应版本。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤 / How to reproduce
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: 确认 / Assignment
      options:
        - label: 已经提交复现所需要的附加资料 / Submit additions related with bugs
          required: true
  - type: textarea
    attributes:
      label: 其他信息 / Additions
      description: |
        反馈WEB书架前端问题时请提供浏览器版本信息，如Edge 129.0.2792.89
      placeholder: "请用```将提交的内容包裹"

  - type: textarea
    attributes:
      label: 日志提交 / Relevant log output
      description: |
        墨栖阅读日志位于“我的 → 关于 → 崩溃日志/保存日志”或书架右上角日志。上传前请删除 Cookie、请求头、账号、文件路径等隐私信息。
      placeholder: "请用```将日志内容包裹"

  - type: input
    attributes:
      label: 墨栖阅读版本 / Moqi Reader version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    attributes:
      label: Android版本 / Android version
      placeholder: "Android 12"
    validations:
      required: true
  - type: input
    attributes:
      label: 机型 / Model
      placeholder: "Redmi K30 Pro"
    validations:
      required: true
